<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Bikini Collection</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts untuk font aesthetic -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Header / Navigasi -->
    <header>
        <div class="logo">S O L E I L</div>
        <nav>
            <a href="#">Collection</a>
            <a href="#">Stories</a>
            <a href="#">About</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <span class="sub-title">Summer Essentials</span>
            <h1>The Sun-Kissed <br><i>Collection</i></h1>
            <p>Minimalist swimwear designed to embrace natural silhouettes and golden hour aesthetics.</p>
            <a href="#" class="btn">Explore Pieces</a>
        </div>
        <div class="hero-image">
            <!-- Ganti URL gambar di bawah dengan foto bikini aesthetic Anda -->
            <img src="https://unsplash.com" alt="Summer Aesthetic">
        </div>
    </section>

    <!-- Grid Produk Aesthetic -->
    <section class="products">
        <div class="section-header">
            <h2>Curated Outfits</h2>
        </div>
        <div class="product-grid">
            <!-- Kartu Produk 1 -->
            <div class="product-card">
                <div class="img-container">
                    <img src="https://unsplash.com" alt="Bikini 1">
                </div>
                <h3>Terracotta Ribbed Set</h3>
                <p class="price">$45.00</p>
            </div>
            <!-- Kartu Produk 2 -->
            <div class="product-card">
                <div class="img-container">
                    <img src="https://unsplash.com" alt="Bikini 2">
                </div>
                <h3>Sage Minimalist One-Piece</h3>
                <p class="price">$52.00</p>
            </div>
        </div>
    </section>

</body>
</html>
